<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12162f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Two Skies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap">
<style>
:root{
  --bg:#12162f; --panel:#1c2247; --ink:#f3eedc; --soft:#a9a6c4; --line:#2e3667;
  --sun:#f6b74e; --sun-glow:#ffe08a; --moon:#9fb1ff; --good:#5fd39a; --warn:#ff8a7a;
  --f-display:"Bricolage Grotesque","Noto Sans Myanmar","Trebuchet MS",system-ui,sans-serif;
  --f-body:"DM Sans","Noto Sans Myanmar",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);-webkit-text-size-adjust:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
body.my{line-height:1.8}
body.playing{overflow:hidden;position:fixed;inset:0;padding:0}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;align-self:flex-start}
.lang button{background:none;border:0;color:var(--soft);padding:6px 14px;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}
.hero h1{font-size:clamp(46px,13vw,84px);font-weight:800;letter-spacing:-.02em}
.hero h1 .s{color:var(--sun)} .hero h1 .m{color:var(--moon)}
.hero{display:flex;flex-direction:column;gap:8px}
.hero p{color:var(--soft);max-width:54ch}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:2px solid transparent;border-radius:18px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px}
.role.sun{background:linear-gradient(160deg,#ffcf72,#e8781f);color:#3a1d04}
.role.moon{background:linear-gradient(160deg,#36408c,#11163a);color:#e7e9ff}
.role[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 4px #ffffff22}
.role h3{font-size:26px}
.role span{font-size:14px;opacity:.85}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;letter-spacing:.05em}
.primary{background:var(--sun);color:#2a1503;border:0;border-radius:12px;padding:12px 20px;font-weight:700}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px}
.card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--soft)}
.card b{color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvbtn{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-width:0}
.lvbtn b{font-family:var(--f-display);font-size:22px}
.lvbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;color:var(--soft)}
.lvbtn[aria-pressed="true"]{border-color:var(--sun)}
.lvbtn:disabled{opacity:.35}
.err{color:var(--warn);font-size:14px;min-height:20px}
@media (max-width:420px){.pick{grid-template-columns:1fr}.levels{grid-template-columns:repeat(5,1fr)}}

/* ---------- game (full screen) ---------- */
.stage{position:fixed;inset:0;background:#0b0e22;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage *{touch-action:none}
.look{position:absolute;inset:0}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 0 calc(12px + env(safe-area-inset-left,0px));pointer-events:none}
.pill{pointer-events:auto;background:#0b0e22c0;border:1px solid #ffffff1f;border-radius:14px;padding:6px 12px;font-size:13px;display:flex;flex-direction:column;gap:1px;max-width:62vw}
.pill b{font-family:var(--f-display);font-size:16px}
.pill .st{display:flex;align-items:center;gap:6px;color:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--soft);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.menubtn{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid #ffffff1f;background:#0b0e22c0;color:var(--ink);font-size:20px}
.menu{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:#141a3cf2;border:1px solid #ffffff22;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:210px;z-index:20}
.menu .ghost{text-align:left;border-radius:10px}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 24px));background:#0b0e22e0;border:1px solid #ffffff22;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px;pointer-events:none;transition:opacity .25s}
.hint i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun);color:#2a1503;display:grid;place-items:center;font-weight:800}
.hint.off{opacity:0}
.toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#000b;padding:10px 18px;border-radius:12px;font-weight:700;pointer-events:none;text-align:center;max-width:80vw}
.banner{position:absolute;inset:0;display:grid;place-items:center;background:#0b0e2288;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,54px);color:var(--sun-glow);text-align:center;padding:12px;pointer-events:none;z-index:15}
.joy{position:absolute;left:0;bottom:0;width:48%;height:62%}
.joyhint{position:absolute;left:calc(40px + env(safe-area-inset-left,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;border:2px dashed #ffffff30;pointer-events:none;display:grid;place-items:center;color:#ffffff60;font-size:12px;text-align:center}
.joybase{position:absolute;width:120px;height:120px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff40;transform:translate(-50%,-50%);pointer-events:none}
.joyknob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffffffd0;box-shadow:0 2px 10px #0006}
.acts{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,auto);grid-template-rows:auto auto auto;gap:10px;align-items:end;justify-items:center}
.abtn{border:0;border-radius:50%;display:grid;place-items:center;font-weight:800;box-shadow:0 5px 0 #0008,0 8px 16px #0006}
.abtn:active,.abtn.down{transform:translateY(3px);box-shadow:0 2px 0 #0008}
.jump{grid-column:3;grid-row:2/4;width:86px;height:86px;background:var(--sun);color:#2a1503;font-size:15px}
body.moonrole .jump{background:var(--moon);color:#141a3c}
.punch{grid-column:2;grid-row:3;width:66px;height:66px;background:#ff7a59;font-size:28px}
.emo{width:48px;height:48px;background:#1c2247e6;border:1px solid #ffffff33;font-size:22px}
.e1{grid-column:1;grid-row:3}.e2{grid-column:1;grid-row:2}.e3{grid-column:2;grid-row:2}
.swapbtn{grid-column:1/4;grid-row:1;border-radius:999px;border:0;background:#000a;color:var(--ink);padding:8px 12px;font-size:13px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--soft)}
.end{display:flex;flex-direction:column;gap:14px}
.end h2{font-size:clamp(40px,11vw,70px);font-weight:800}
.eclipse{height:130px;border-radius:20px;background:linear-gradient(90deg,#ffcf72 0 50%,#11163a 50%);position:relative}
.eclipse::after{content:"";position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(90deg,#fff3c4 50%,#e2e8ff 50%);box-shadow:0 0 34px 8px #ffe08a99}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="stage" id="stage" hidden>
  <div class="look" id="look"></div>
  <div class="joy" id="joy"><div class="joyhint" id="joyhint"></div></div>
  <div class="hud">
    <div class="pill"><b id="lvname"></b><span class="st" id="status"></span></div>
    <button class="menubtn" id="menubtn" aria-label="Menu">☰</button>
  </div>
  <div class="menu" id="menu" hidden></div>
  <div class="hint off" id="hint"><i>!</i><span></span></div>
  <div class="acts" id="acts">
    <button class="swapbtn" id="swap" hidden></button>
    <button class="abtn emo e2" data-a="dance" aria-label="Dance">💃</button>
    <button class="abtn emo e3" data-a="wave" aria-label="Wave">👋</button>
    <button class="abtn emo e1" data-a="heart" aria-label="Hearts">❤️</button>
    <button class="abtn punch" data-a="punch" aria-label="Punch">👊</button>
    <button class="abtn jump" data-a="jump" id="jumpbtn"></button>
  </div>
  <div class="banner" id="ban" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

/* ===================== runtime level ===================== */
let RT=null,PS={};
function loadLevel(i){
 S.lvl=i;S.advancing=false;
 const d=LV[i];
 RT={T:0,dyn:[],tog:[],crates:{},debris:[],hearts:[]};
 (d.movers||[]).forEach((m,k)=>RT.dyn.push({key:"m"+k,kind:"mover",def:m,x:m.x,y:m.y,z:m.z,w:m.w,h:m.h,d:m.d,dx:0,dy:0,dz:0}));
 (d.lifts||[]).forEach((m,k)=>RT.dyn.push({key:"l"+k,kind:"lift",def:m,x:m.x,y:m.y0,z:m.z,w:m.w,h:m.h,d:m.d,dx:0,dy:0,dz:0}));
 (d.toggles||[]).forEach((g,k)=>RT.tog.push({def:g,on:false,anim:0}));
 (d.crates||[]).forEach(c=>RT.crates[c.id]={def:c,hp:c.hp,shake:0});
 for(const P of [PL.sun,PL.moon]){if(!P)continue;P.cp=0;spawn(P);P.act=null;P.stun=0}
 if(OTHER)OTHER.seen=false;
 if(G.r)buildLevel();
 hudLevel();
}
function spawn(P){const c=LV[S.lvl].cps[P.cp];P.pos.set(c.x+SPAWN_DX[P.role],c.y+.6,c.z);P.vel.set(0,0,0);P.gkey=null;P.ry=Math.PI}

function positions(){const out=[];
 if(S.mode==="local")out.push(PL.sun.pos,PL.moon.pos);
 else{out.push(ME.pos);if(partnerHere())out.push(OTHER.pos)}
 return out}
function partnerHere(){return !!(partner&&OTHER&&OTHER.seen&&partner.lvl===S.lvl)}
function computePlates(){const pos=positions(),o={};
 for(const p of LV[S.lvl].plates||[])o[p.id]=pos.some(q=>Math.hypot(q.x-p.x,q.z-p.z)<.95&&Math.abs(q.y-p.y)<.45);return o}

function solids(role){const out=[],d=LV[S.lvl];
 for(const b of d.boxes){const[x,y,z,w,h,dd,k]=b;if(k==="g"&&role!=="sun")continue;if(k==="b"&&role!=="moon")continue;out.push({x,y,z,w,h,d:dd})}
 for(const g of RT.tog){const solid=g.def.type==="gate"?!g.on:g.on;if(solid)out.push(g.def)}
 for(const m of RT.dyn)out.push(m);
 for(const id in RT.crates){const c=RT.crates[id];if(c.hp>0)out.push(c.def)}
 return out}
const PW=.3,PH=1.55;
function hit(p,boxes){for(const b of boxes){if(Math.abs(p.x-b.x)<b.w/2+PW&&Math.abs(p.z-b.z)<b.d/2+PW&&p.y<b.y+b.h/2&&p.y+PH>b.y-b.h/2)return b}return null}

function updateWorld(dt){
 RT.T+=dt;
 for(const m of RT.dyn){const ox=m.x,oy=m.y,oz=m.z;
  if(m.kind==="mover"){const s=m.def.amp*Math.sin(RT.T*m.def.sp+m.def.ph);m.x=m.def.x+(m.def.ax==="x"?s:0);m.z=m.def.z+(m.def.ax==="z"?s:0)}
  else{const tgt=m.def.cond(PS)?m.def.y1:m.def.y0;const st=m.def.sp*dt;m.y+=Math.max(-st,Math.min(st,tgt-m.y))}
  m.dx=m.x-ox;m.dy=m.y-oy;m.dz=m.z-oz}
 for(const g of RT.tog){const c=!!g.def.cond(PS);const was=g.on;g.on=g.def.latch?(g.on||c):c;if(!was&&g.on&&g.def.latch&&g.def.msg)toast(t(g.def.msg))}
}

function stepPlayer(P,ix,iz,jump,dt){
 // ride moving platforms
 if(P.gkey){const m=RT.dyn.find(q=>q.key===P.gkey);if(m){P.pos.x+=m.dx;P.pos.y+=m.dy;P.pos.z+=m.dz}}
 const boxes=solids(P.role);
 if(P.stun>0){P.stun-=dt;ix=0;iz=0;jump=false}
 const sp=5.2,k=Math.min(1,dt*(P.stun>0?2:(P.grounded?14:5)));
 P.vel.x+=(ix*sp-P.vel.x)*k;P.vel.z+=(iz*sp-P.vel.z)*k;
 if(jump&&P.grounded){P.vel.y=8.2;P.grounded=false;P.gkey=null}
 P.vel.y-=24*dt;if(P.vel.y<-20)P.vel.y=-20;
 P.pos.x+=P.vel.x*dt;if(hit(P.pos,boxes)){P.pos.x-=P.vel.x*dt;P.vel.x=0}
 P.pos.z+=P.vel.z*dt;if(hit(P.pos,boxes)){P.pos.z-=P.vel.z*dt;P.vel.z=0}
 P.grounded=false;P.gkey=null;
 P.pos.y+=P.vel.y*dt;const b=hit(P.pos,boxes);
 if(b){if(P.vel.y<=0){P.pos.y=b.y+b.h/2;P.grounded=true;P.gkey=b.key||null}else P.pos.y=b.y-b.h/2-PH-.001;P.vel.y=0}
 else if(hit(P.pos,boxes)===null){/* free */}
 // pushed up by a rising lift
 const inside=hit(P.pos,boxes);if(inside&&inside.key){P.pos.y=inside.y+inside.h/2;P.grounded=true;P.gkey=inside.key}
 const v=Math.hypot(P.vel.x,P.vel.z);P.moving=v>.6&&P.stun<=0?1:0;
 if(v>.3&&P.stun<=0)P.ry=Math.atan2(P.vel.x,P.vel.z);
 if(P.moving&&(P.act==="dance"||P.act==="wave"))P.act=null;
 if(P.grounded){const cps=LV[S.lvl].cps;cps.forEach((c,i)=>{if(i>P.cp&&Math.hypot(P.pos.x-c.x,P.pos.z-c.z)<3.2&&P.pos.y>c.y-.4)P.cp=i})}
 if(P.pos.y<-9)respawn(P,true);
 // actions
 if(P.act){P.actT+=dt;
  if(P.act==="punch"&&!P.hitDone&&P.actT>.12){P.hitDone=true;doPunch(P)}
  const dur={punch:.38,dance:3.2,wave:1.8,heart:1.2}[P.act];if(P.actT>dur)P.act=null}
}
function respawn(P,fell){spawn(P);if(fell&&P===controlled())toast(t("fell"))}

function startAct(P,a){if(!P||S.advancing)return;if(a==="punch"&&P.act==="punch"&&P.actT<.3)return;
 P.act=a;P.actT=0;P.actN=(P.actN+1)%1000;P.hitDone=false;if(a==="heart")spawnHearts(P)}
function doPunch(P){
 const fx=Math.sin(P.ry),fz=Math.cos(P.ry);
 const hx=P.pos.x+fx*.7,hz=P.pos.z+fz*.7,hy=P.pos.y+1;
 for(const id in RT.crates){const c=RT.crates[id];if(c.hp<=0)continue;const d=c.def;
  if(Math.abs(hx-d.x)<d.w/2+.45&&Math.abs(hz-d.z)<d.d/2+.45&&hy>d.y-d.h/2-.2&&hy<d.y+d.h/2+.5){damageCrate(id,c.hp-1,true);break}}
 // partner
 const others=S.mode==="local"?[P===PL.sun?PL.moon:PL.sun]:(partnerHere()?[OTHER]:[]);
 for(const O of others){const dx=O.pos.x-P.pos.x,dz=O.pos.z-P.pos.z,dist=Math.hypot(dx,dz);
  if(dist<1.5&&Math.abs(O.pos.y-P.pos.y)<1.2&&(dx*fx+dz*fz)/Math.max(dist,.01)>.3){
   const nx=dx/Math.max(dist,.01),nz=dz/Math.max(dist,.01);
   if(S.mode==="local")knock(O,nx,nz);else send({t:"hit",nx,nz,lvl:S.lvl})}}
 if(P.model)pow(P.pos.x+fx*.8,P.pos.y+1.1,P.pos.z+fz*.8)}
function knock(P,nx,nz){P.vel.set(nx*7,5.5,nz*7);P.grounded=false;P.gkey=null;P.stun=.45;P.spin=1}
function damageCrate(id,hp,local){const c=RT.crates[id];if(!c||hp>=c.hp)return;c.hp=Math.max(0,hp);c.shake=1;
 if(c.hp===0&&c.mesh){burst(c);c.mesh.visible=false}
 if(local&&S.mode==="online")send({t:"crate",id,hp:c.hp,lvl:S.lvl})}

function animate(P,dt,T){const m=P.model;if(!m)return;

 const L=(o,v,s=14)=>o+(v-o)*Math.min(1,dt*s);

 const air=!P.grounded;if(P.moving&&!air)P.walkT+=dt*11;
 const sw=air?0:(P.moving?Math.sin(P.walkT)*.8:0);
 let lL=air?-.6:sw,lR=air?.3:-sw,aLx=air?-2.6:-sw*.9,aRx=air?-2.6:sw*.9,aLz=air?-.3:0,aRz=air?.3:0,ty=0,tz=0,bodyRy=0,bodyY=(P.moving&&!air?Math.abs(Math.cos(P.walkT))*.06:Math.sin(T*2.4)*.015);
 const a=P.act,at=P.actT;
 if(a==="punch"){const k=at<.12?at/.12:Math.max(0,1-(at-.12)/.26);aRx=-1.6*k;aRz=0;ty=-.25*k;aLx=.4*k}
 else if(a==="dance"){const b=T*9;aLx=-2.8+Math.sin(b)*.4;aRx=-2.8-Math.sin(b)*.4;aLz=-.5;aRz=.5;lL=Math.max(0,Math.sin(b))*.6;lR=Math.max(0,-Math.sin(b))*.6;tz=Math.sin(b)*.18;bodyY=Math.abs(Math.sin(b))*.12;bodyRy=at*4}
 else if(a==="wave"){aRz=2.6+Math.sin(T*14)*.35;aRx=0}
 else if(a==="heart"){aLx=-1.9;aRx=-1.9;aLz=.5;aRz=-.5}
 if(S.won||S.advancing){aLx=-2.9;aRx=-2.9;bodyY=Math.abs(Math.sin(T*7))*.3}
 if(P.stun>0){bodyRy=(P.spin||0)*(.45-P.stun)*14}
 m.lL.rotation.x=L(m.lL.rotation.x,lL);m.lR.rotation.x=L(m.lR.rotation.x,lR);
 m.aL.rotation.x=L(m.aL.rotation.x,aLx,a==="punch"?30:14);m.aR.rotation.x=L(m.aR.rotation.x,aRx,a==="punch"?30:14);
 m.aL.rotation.z=L(m.aL.rotation.z,aLz);m.aR.rotation.z=L(m.aR.rotation.z,aRz);
 m.torso.rotation.y=L(m.torso.rotation.y,ty,20);m.torso.rotation.z=L(m.torso.rotation.z,tz);
 m.body.rotation.y=a==="dance"||P.stun>0?bodyRy:L(m.body.rotation.y,0,10);
 m.body.position.y=bodyY;
 if(m.head.userData.spin)m.head.userData.spin.rotation.y+=dt*1.2}

 for(const id in RT.crates){const c=RT.crates[id];if(c.mesh&&c.hp>0){c.shake=Math.max(0,c.shake-dt*4);c.mesh.position.x=c.def.x+Math.sin(T*60)*.06*c.shake}}
 for(const p of LV[S.lvl].plates||[]){const g=G.plates[p.id];if(!g)continue;const on=PS[p.id],bt=g.userData.btn;
  bt.position.y+=((on?.03:.1)-bt.position.y)*Math.min(1,dt*14);bt.material.emissiveIntensity+=((on?1.3:.35)-bt.material.emissiveIntensity)*Math.min(1,dt*10);
  if(g.userData.star){g.userData.star.rotation.y+=dt*2;g.userData.star.position.y=1.4+Math.sin(T*2)*.1}}
 if(G.beam)G.beam.material.opacity=.14+Math.sin(T*2)*.05;
 for(const P of [PL.sun,PL.moon]){const vis=S.mode==="local"||P===ME||partnerHere();P.model.root.visible=vis;if(vis)animate(P,dt,T)}
 updateFx(dt);
 // camera (smooth, constant distance)
 const Cp=controlled().pos;
 if(!G.camT)G.camT=Cp.clone();
 G.camT.x+=(Cp.x-G.camT.x)*Math.min(1,dt*10);G.camT.z+=(Cp.z-G.camT.z)*Math.min(1,dt*10);G.camT.y+=(Cp.y-G.camT.y)*Math.min(1,dt*3);
 const dist=7.2,cp=Math.cos(G.pitch);
 G.cam.position.set(G.camT.x+Math.sin(G.yaw)*cp*dist,G.camT.y+1.1+Math.sin(G.pitch)*dist,G.camT.z+Math.cos(G.yaw)*cp*dist);
 G.cam.lookAt(G.camT.x,G.camT.y+1.1,G.camT.z);
 G.sun.position.set(Cp.x-6,Cp.y+14,Cp.z+6);G.sun.target.position.copy(Cp);
 // hints
 let near=null,best=1e9;for(const s of LV[S.lvl].signs){const d=Math.hypot(Cp.x-s.x,Cp.z-s.z);if(d<s.r&&d<best){best=d;near=s}}
 const hint=document.getElementById("hint");if(near){if(lastHint!==near.k+LANG){hint.querySelector("span").textContent=t(near.k);lastHint=near.k+LANG}hint.classList.remove("off")}else hint.classList.add("off");
 // level complete
 const gl=LV[S.lvl].goal,ps=S.mode==="local"?[PL.sun.pos,PL.moon.pos]:(partnerHere()?[ME.pos,OTHER.pos]:[ME.pos]);
 if(!S.advancing&&ps.length===2&&ps.every(p=>Math.hypot(p.x-gl.x,p.z-gl.z)<gl.r&&p.y>gl.y-.5))levelDone();
 // network
 if(S.mode==="online"&&performance.now()-lastSend>66){lastSend=performance.now();sendState()}
 G.r.render(G.scene,G.cam)}

function levelDone(){S.advancing=true;const ban=document.getElementById("ban");ban.textContent=t("lvDone");ban.hidden=false;
 const next=S.lvl+1;unlocked=Math.max(unlocked,Math.min(NL,next+1));ls("ts.unlocked",unlocked);
 setTimeout(()=>{ban.hidden=true;if(next>=NL){S.won=true;showEnd()}else loadLevel(next)},2600)}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;stage.appendChild(d);setTimeout(()=>d.remove(),1900)}
let rzT=null;function resize(){if(!G.r)return;const w=window.innerWidth,h=window.innerHeight;G.r.setSize(w,h,false);G.cam.aspect=w/h;G.cam.updateProjectionMatrix()}
window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(resize,120)});

/* ===================== network (peer-to-peer) ===================== */
let peer=null,conn=null,lastData=0;
function connect(){
 if(!window.Peer)return Promise.resolve(false);
 const id="twoskies2-"+S.code;
 return new Promise(res=>{let done=false;const finish=v=>{if(!done){done=true;res(v)}};
  const host=new Peer(id,{debug:0});
  host.on("open",()=>{peer=host;host.on("connection",c=>{if(conn)conn.close();attach(c)});finish(true)});
  host.on("error",e=>{if(e.type==="unavailable-id"){host.destroy();const g=new Peer({debug:0});
    g.on("open",()=>{peer=g;attach(g.connect(id));finish(true)});g.on("error",()=>{if(!done)finish(false);else hudStatus()})}
   else if(!done)finish(false)});
  setTimeout(()=>finish(false),15000)})}
function attach(c){conn=c;c.on("data",onData);c.on("open",()=>{hudStatus();sendState()});c.on("close",()=>{if(conn===c){conn=null;partner=null;hudStatus()}});c.on("error",()=>{})}
function send(o){if(conn&&conn.open)try{conn.send(o)}catch(e){}}
function sendState(){if(!ME)return;const ch={};for(const id in RT.crates){const c=RT.crates[id];if(c.hp<c.def.hp)ch[id]=c.hp}
 send({t:"s",role:S.role,lvl:S.lvl,x:+ME.pos.x.toFixed(2),y:+ME.pos.y.toFixed(2),z:+ME.pos.z.toFixed(2),ry:+ME.ry.toFixed(2),mv:ME.moving,gr:ME.grounded?1:0,act:ME.act||"",an:ME.actN,st:ME.stun>0?1:0,ch})}
function onData(p){if(!p||typeof p!=="object")return;
 if(p.t==="hit"){if(p.lvl===S.lvl&&ME)knock(ME,p.nx,p.nz);return}
 if(p.t==="crate"){if(p.lvl===S.lvl)damageCrate(p.id,p.hp,false);return}
 if(p.t!=="s"||p.role===S.role||typeof p.x!=="number")return;
 lastData=performance.now();const fresh=!partner;partner={lvl:p.lvl};
 if(p.lvl>S.lvl&&p.lvl<NL&&!S.advancing){unlocked=Math.max(unlocked,p.lvl+1);loadLevel(p.lvl)}
 if(p.lvl===S.lvl){for(const id in (p.ch||{}))damageCrate(id,p.ch[id],false)}
 if(OTHER){const v=new THREE.Vector3(p.x,p.y,p.z);
  if(!OTHER.seen||OTHER.pos.distanceTo(v)>6)OTHER.pos.copy(v);
  OTHER.target=v;OTHER.tRy=p.ry||0;OTHER.moving=p.mv?1:0;OTHER.grounded=!!p.gr;OTHER.stun=p.st?.3:0;OTHER.spin=1;OTHER.seen=true;
  if(p.an!==OTHER.actN){OTHER.actN=p.an;if(p.act){OTHER.act=p.act;OTHER.actT=0;if(p.act==="heart")spawnHearts(OTHER)}}
  if(!p.act&&OTHER.act&&OTHER.act!=="punch")OTHER.act=null}
 if(fresh)hudStatus()}
setInterval(()=>{if(partner&&performance.now()-lastData>5000){partner=null;hudStatus()}},1000);
function disconnect(){try{if(conn)conn.close()}catch(e){}try{if(peer)peer.destroy()}catch(e){}conn=null;peer=null;partner=null}

/* ===================== views ===================== */
function langToggle(){return `<div class="lang" role="group"><button data-l="en" aria-pressed="${LANG==="en"}">English</button><button data-l="my" aria-pressed="${LANG==="my"}">မြန်မာ</button></div>`}
function bindLang(root,rerender){root.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{setLang(b.dataset.l);rerender()})}
let pickedLv=0;
function lobby(){
 document.body.classList.remove("playing");stage.hidden=true;app.hidden=false;
 const code=S.code||ls("ts.code")||("sky"+Math.floor(1000+Math.random()*9000));
 pickedLv=Math.min(pickedLv,unlocked-1);
 app.innerHTML=`${langToggle()}<div class="hero"><p class="eyebrow">${t("tag")}</p>
  <h1><span class="s">Two</span> <span class="m">Skies</span></h1><p>${t("intro")}</p></div>
  <div class="pick">
   <button class="role sun" data-r="sun" aria-pressed="false"><h3>☀ ${t("sun")}</h3><span>${t("sunSub")}</span></button>
   <button class="role moon" data-r="moon" aria-pressed="false"><h3>☾ ${t("moon")}</h3><span>${t("moonSub")}</span></button></div>
  <div class="field"><label>${t("chooseLv")}</label><div class="levels">${LV.map((l,i)=>`<button class="lvbtn" data-i="${i}" aria-pressed="${i===pickedLv}" ${i>=unlocked?"disabled":""}><b>${i>=unlocked?"🔒":i+1}</b><span>${t(l.name)}</span></button>`).join("")}</div></div>
  <div class="field"><label for="code">${t("code")}</label>
   <div class="row"><input id="code" value="${code}" maxlength="20" autocomplete="off"><button class="primary" id="go" disabled>${t("join")}</button></div>
   <p class="err" id="err"></p></div>
  <div class="row"><button class="ghost" id="solo">${t("solo")}</button></div>
  <div class="card"><p class="eyebrow">${t("how")}</p><ol><li>${t("h1")}</li><li>${t("h2")}</li><li>${t("h3")}</li><li>${t("h4")}</li></ol></div>`;
 bindLang(app,lobby);
 let role=null;const go=document.getElementById("go");
 app.querySelectorAll(".role").forEach(b=>b.onclick=()=>{role=b.dataset.r;app.querySelectorAll(".role").forEach(x=>x.setAttribute("aria-pressed",x===b));go.disabled=false});
 app.querySelectorAll(".lvbtn").forEach(b=>b.onclick=()=>{pickedLv=+b.dataset.i;app.querySelectorAll(".lvbtn").forEach(x=>x.setAttribute("aria-pressed",x===b))});
 go.onclick=async()=>{const v=document.getElementById("code").value.toLowerCase().replace(/[^a-z0-9]/g,"");const err=document.getElementById("err");
  if(!v){err.textContent=t("noCode");return}
  go.disabled=true;go.textContent=t("joining");S.code=v;ls("ts.code",v);S.role=role;S.mode="online";
  const ok=await connect();
  if(!ok){S.mode=null;go.disabled=false;go.textContent=t("join");err.textContent=t("noConn");return}
  startGame()};
 document.getElementById("solo").onclick=()=>{S.mode="local";S.role="sun";activeRole="sun";startGame()};
}
function startGame(){
 if(!window.THREE){app.innerHTML=`<p class="err">${t("noGL")}</p>`;return}
 PL.sun=PL.sun||newPlayer("sun");PL.moon=PL.moon||newPlayer("moon");
 ME=S.role==="moon"?PL.moon:PL.sun;OTHER=S.mode==="online"?(ME===PL.sun?PL.moon:PL.sun):null;
 S.won=false;S.start=Date.now();
 app.hidden=true;stage.hidden=false;document.body.classList.add("playing");document.body.classList.toggle("moonrole",S.role==="moon");
 if(!initGL()){stage.insertAdjacentHTML("beforeend",`<div class="nogl">${t("noGL")}</div>`);return}
 if(!stage.querySelector("canvas")){stage.prepend(G.r.domElement);bindStage()}
 resize();G.yaw=0;G.pitch=.48;
 loadLevel(pickedLv);
 hudTexts();hudStatus();window.scrollTo(0,0)}
function hudLevel(){document.getElementById("lvname").textContent=`${t("level")(S.lvl+1)} · ${t(LV[S.lvl].name)}`;lastHint=null}
function hudTexts(){document.getElementById("jumpbtn").textContent=t("jump");document.getElementById("joyhint").textContent=t("walk");
 document.getElementById("swap").hidden=S.mode!=="local";hudLevel();hudStatus();buildMenu()}
function hudStatus(){
 const sw=document.getElementById("swap");sw.textContent=t("switchTo")(roleName(activeRole==="sun"?"moon":"sun"));
 const st=document.getElementById("status");
 if(S.mode==="local"){st.innerHTML=`<span class="dot on"></span>${t("practice")} · ${roleName(activeRole)}`;return}
 const o=roleName(S.role==="sun"?"moon":"sun");
 st.innerHTML=`<span class="dot ${partner?"on":""}"></span>${t("you")(roleName(S.role))} · ${partner?(partner.lvl===S.lvl?t("here")(o):t("elsewhere")(o)):t("waiting")(o)+" "+S.code}`}
function buildMenu(){const m=document.getElementById("menu");
 m.innerHTML=`${langToggle()}<button class="ghost" id="mBack">${t("back")}</button><button class="ghost" id="mRestart">${t("restart")}</button><button class="ghost" id="mLeave">${t("leave")}</button>`;
 bindLang(m,()=>{hudTexts();lastHint=null});
 m.querySelector("#mBack").onclick=()=>{respawn(controlled(),false);toggleMenu(false)};
 m.querySelector("#mRestart").onclick=()=>{loadLevel(S.lvl);toggleMenu(false)};
 m.querySelector("#mLeave").onclick=()=>{toggleMenu(false);disconnect();S.mode=null;lobby()}}
function toggleMenu(force){const m=document.getElementById("menu");m.hidden=typeof force==="boolean"?!force:!m.hidden}
function swapChar(){activeRole=activeRole==="sun"?"moon":"sun";G.camT=null;hudStatus()}
function showEnd(){
 document.body.classList.remove("playing");stage.hidden=true;app.hidden=false;
 const mins=S.start?Math.max(1,Math.round((Date.now()-S.start)/60000)):null;
 app.innerHTML=`${langToggle()}<div class="end"><h2>${t("win")}</h2><div class="eclipse"></div><p>${t("winSub")(mins)}</p>
  <div class="row"><button class="primary" id="again">${t("again")}</button><button class="ghost" id="lobby">${t("lobby")}</button></div></div>`;
 bindLang(app,showEnd);
 document.getElementById("again").onclick=()=>{pickedLv=0;startGame()};
 document.getElementById("lobby").onclick=()=>{disconnect();S.mode=null;S.won=false;lobby()}}
lobby();
</script>
</body>
</html>
